version: '3.8'

services:
  redpatch-app:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - lab_tmp:/app/labs/archives
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      - ARCHIVE_DIR=${ARCHIVE_DIR:-/app/labs/archives}
      - CONFIG_JSON=${CONFIG_JSON:-/app/core/config.json}
    networks:
      - redpatch_net
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  lab_tmp:
    name: redpatch_lab_tmp

networks:
  redpatch_net:
    name: redpatch_net
